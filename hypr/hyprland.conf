# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 4
    gaps_out = 12

    border_size = 0

    resize_on_border = true
    extend_border_grab_area = 15
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 0

    # Fully opaque — lets Hyprland cull hidden windows and skip alpha blending
    active_opacity = 1.0
    inactive_opacity = 1.0
    fullscreen_opacity = 1.0

    shadow {
        enabled = false
        range = 20
        render_power = 3
        color = rgba(00ff4140)
        color_inactive = rgba(00000060)
        offset = 0 0
        scale = 1.0
    }

    # Blur disabled — background is pure black, so blur was mostly wasted GPU
    blur {
        enabled = false
        size = 6
        passes = 2
        new_optimizations = true
        noise = 0.02
        contrast = 1.1
        brightness = 0.65
        vibrancy = 0.3
        vibrancy_darkness = 0.6
        special = true
        popups = true
        popups_ignorealpha = 0.2
        xray = false
    }

    # Dim inactive windows for focus
    dim_inactive = false
    dim_strength = 0
}

# https://wiki.hypr.land/Configuring/Variables/#animations
# Animations disabled for minimal GPU use — compositor does zero animation work.
# Bezier/animation lines below are inert while enabled = false (kept for easy re-enable).
animations {
    enabled = false

    # --- Fluid spring curves (Caelestia philosophy) ---
    # Silky: buttery smooth deceleration — the signature "flow" feel
    bezier = silky, 0.05, 0.9, 0.1, 1.05
    # Spring: natural overshoot like a physical spring settling
    bezier = spring, 0.13, 0.99, 0.29, 1.1
    # Whip: explosive start, elegant deceleration — snaps then glides
    bezier = whip, 0.22, 1.2, 0.36, 1.0
    # Ghost: ethereal fade — slow materialization from nothing
    bezier = ghost, 0.33, 0.0, 0.0, 1.0
    # Snap: instant response with micro-overshoot — crisp and decisive
    bezier = snap, 0.0, 0.85, 0.15, 1.06
    # Dissolve: accelerates into void — things cease to exist
    bezier = dissolve, 0.4, 0.0, 0.8, 0.15
    # Bounce: playful double-overshoot — lands then settles
    bezier = bounce, 0.05, 0.95, 0.1, 1.12
    # Breathe: organic ease — inhale/exhale rhythm
    bezier = breathe, 0.25, 0.46, 0.45, 0.94

    # --- Windows ---
    # Open: springs into existence with a satisfying overshoot
    animation = windowsIn,     1, 5, spring, popin 15%
    # Close: dissolves while shrinking — fades into the void
    animation = windowsOut,    1, 3, dissolve, popin 85%
    # Move: whips to position with fluid momentum
    animation = windowsMove,   1, 4, whip

    # --- Workspaces ---
    # Slide with parallax-like depth — Caelestia signature feel
    animation = workspacesIn,  1, 5, silky, slidefade 40%
    animation = workspacesOut, 1, 4, silky, slidefade -40%

    # --- Special workspace (scratchpad) ---
    # Bounces down from above like a terminal dropping in
    animation = specialWorkspace, 1, 5, bounce, slidefadevert -40%

    # --- Fades ---
    animation = fadeIn,        1, 4, ghost
    animation = fadeOut,       1, 3, dissolve
    animation = fadeSwitch,    1, 3, breathe
    animation = fadeDim,       1, 4, breathe
    animation = fadeShadow,    1, 5, ghost

    # --- Layers (rofi, waybar, notifications) ---
    # Layers materialize with a spring — snaps in with weight
    animation = layersIn,      1, 4, snap, popin 80%
    animation = layersOut,     1, 2, dissolve, popin 80%
    animation = fadeLayersIn,  1, 3, ghost
    animation = fadeLayersOut, 1, 2, dissolve

    # --- Border color transitions ---
    animation = border,        1, 10, breathe
    animation = borderangle,   1, 60, breathe
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true
    preserve_split = true
    smart_split = false
    smart_resizing = true
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# Group (tabbed windows) — green hacker tab bar
group {
    col.border_active = rgba(00ff41ee) rgba(39ff14ee) 45deg
    col.border_inactive = rgba(00ff4115)
    col.border_locked_active = rgba(00ff41aa)
    col.border_locked_inactive = rgba(00ff4115)

    groupbar {
        enabled = true
        font_family = JetBrainsMono Nerd Font Mono
        font_size = 10
        height = 18
        col.active = rgba(00ff4140)
        col.inactive = rgba(050a0580)
        text_color = rgba(00ff41ff)
        gaps_in = 2
        gaps_out = 2
        rounding = 0
    }
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = 0x000000
    animate_manual_resizes = false
    animate_mouse_windowdragging = false
    focus_on_activate = true
    new_window_takes_over_fullscreen = 2
}

# Suppress harmless NVIDIA page-flip error notifications on startup
debug {
    suppress_errors = true
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    repeat_delay = 200
    repeat_rate = 175

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}


# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle


# Window/Session actions
bind = $mainMod SHIFT, Q, killactive # killactive, kill the window on focus
bind = ALT, F4, killactive, # kill the window on focus
bind = $mainMod, return, exec, terminator # open terminator
bind = $mainMod, delete, exit, # kill hyperland session
bind = $mainMod, W, togglefloating, # toggle the window on focus to float
bind = $mainMod, G, togglegroup, # toggle the window on focus to group (tab mode)
bind = $mainMod, F, fullscreen, 1 # toggle the window on focus to fullscreen
bind = $mainMod SHIFT, F, fullscreen, # toggle the window on focus to fullscreen
bind = $mainMod, L, exec, swaylock --screenshots --clock --indicator --indicator-radius 120 --indicator-thickness 8 --effect-blur 15x5 --effect-vignette 0.5:0.5 --ring-color 00ff41 --key-hl-color 39ff14 --line-color 00000000 --inside-color 050a0588 --separator-color 00ff4130 --text-color 00ff41 --font "JetBrainsMono Nerd Font Mono" --grace 3
# fakefullscreen was removed in Hyprland 0.41+; use fullscreenstate instead
bind = $mainMod ALT, F, fullscreenstate, 0 2
# logout menu — no script configured yet
# bind = $mainMod, backspace, exec, ~/.config/rofi/scripts/powermenu.sh
bind = CTRL, ESCAPE, exec, killall waybar || waybar # toggle waybar


# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Special workspace (scratchpad) — uses grave/backtick to avoid conflict with screenshot binds
bind = $mainMod, grave, togglespecialworkspace, magic
bind = $mainMod SHIFT, grave, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Rofi Application Launcher (Super + Space)
bind = SUPER, SPACE, exec, rofi -show drun -theme ~/.config/rofi/themes/hacker-green.rasi

# Rofi Run Command (Super + R)
bind = SUPER, R, exec, rofi -show run -theme ~/.config/rofi/themes/hacker-green.rasi

# Rofi Window Switcher (Alt + Tab)
bind = ALT, Tab, exec, rofi -show window -theme ~/.config/rofi/themes/hacker-green.rasi

# Rofi Emoji Picker (Super + Period)
bind = SUPER, period, exec, rofi -modi emoji -show emoji -theme ~/.config/rofi/themes/hacker-green.rasi

# Rofi Calculator (Super + Equal)
bind = SUPER, equal, exec, rofi -show calc -modi calc -no-show-match -no-sort -theme ~/.config/rofi/themes/hacker-green.rasi

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# ========================
# LAYER RULES — frosted glass everywhere
# ========================
layerrule = blur, waybar
layerrule = blurpopups, waybar
layerrule = ignorealpha 0.3, waybar

layerrule = blur, rofi
layerrule = blurpopups, rofi
layerrule = ignorealpha 0.2, rofi
layerrule = dimaround, rofi

layerrule = blur, swaync-control-center
layerrule = blur, swaync-notification-window
layerrule = ignorealpha 0.3, swaync-control-center
layerrule = ignorealpha 0.3, swaync-notification-window

layerrule = blur, notifications
layerrule = ignorealpha 0.3, notifications

# ========================
# WINDOW RULES — smart behavior for common apps
# ========================

# Float dialogs, file pickers, popups
windowrule = float, title:^(Open File)(.*)$
windowrule = float, title:^(Save File)(.*)$
windowrule = float, title:^(Open Folder)(.*)$
windowrule = float, title:^(Select a File)(.*)$
windowrule = float, title:^(Choose wallpaper)(.*)$
windowrule = float, title:^(File Upload)(.*)$
windowrule = float, title:^(Library)(.*)$
windowrule = float, title:^(Volume Control)(.*)$
windowrule = float, class:^(pavucontrol)$
windowrule = float, class:^(nm-connection-editor)$
windowrule = float, class:^(blueman-manager)$
windowrule = float, class:^(nwg-look)$
windowrule = float, class:^(qt5ct)$
windowrule = float, class:^(qt6ct)$
windowrule = float, class:^(org.kde.polkit-kde-authentication-agent-1)$

# Screen-share source picker (Firefox/Chrome/Teams) — pin to DP-1 (non-rotated),
# float, center, fixed size. On the rotated HDMI-A-1 its clicks mis-mapped -> "selection -1".
windowrule = float, class:^(hyprland-share-picker)$
windowrule = size 760 560, class:^(hyprland-share-picker)$
windowrule = center, class:^(hyprland-share-picker)$
windowrule = monitor DP-1, class:^(hyprland-share-picker)$
windowrule = workspace 2, class:^(hyprland-share-picker)$

# Screen-share source picker (Firefox/Teams/etc) — float, focus, center, on top.
# Without focus grab it opened unfocused/behind the browser and returned "selection -1".
windowrule = noinitialfocus, class:^(NONEXISTENT)$

# Picture in picture — always on top, small, corner
windowrule = float, title:^(Picture-in-Picture)$
windowrule = size 480 270, title:^(Picture-in-Picture)$
windowrule = pin, title:^(Picture-in-Picture)$
windowrule = move 100%-490 100%-280, title:^(Picture-in-Picture)$
windowrule = opacity 1.0 override 1.0 override, title:^(Picture-in-Picture)$

# Fullscreen apps should be fully opaque
windowrule = opacity 1.0 override 1.0 override, class:^(firefox)$, fullscreen:1
windowrule = opacity 1.0 override 1.0 override, class:^(mpv)$
windowrule = opacity 1.0 override 1.0 override, class:^(vlc)$
windowrule = opacity 1.0 override 1.0 override, class:^(com.obsproject.Studio)$
windowrule = opacity 1.0 override 1.0 override, title:^(.*YouTube.*)$, fullscreen:1

# IDEs/editors — slightly more opaque for readability
windowrule = opacity 1.0 override 1.0 override, class:^(Code)$
windowrule = opacity 1.0 override 1.0 override, class:^(code-url-handler)$
windowrule = opacity 1.0 override 1.0 override, class:^(jetbrains-.*)$

# Terminal — embrace the transparency
windowrule = opacity 1.0 override 1.0 override, class:^(terminator)$


# CUSTOM KEYBINDINGS 


# Screenshot keybindings
bind = , Print, exec, ~/.config/hypr/scripts/screenshot.sh fullscreen
bind = SHIFT, Print, exec, ~/.config/hypr/scripts/screenshot.sh region
bind = CTRL, Print, exec, ~/.config/hypr/scripts/screenshot.sh window
bind = ALT, Print, exec, ~/.config/hypr/scripts/screenshot.sh edit
bind = SUPER, Print, exec, ~/.config/hypr/scripts/screenshot.sh quick

# Alternative bindings with SUPER key
bind = SUPER, S, exec, ~/.config/hypr/scripts/screenshot.sh region
bind = SUPER SHIFT, S, exec, ~/.config/hypr/scripts/screenshot.sh fullscreen
bind = SUPER CTRL, S, exec, ~/.config/hypr/scripts/screenshot.sh window
bind = SUPER ALT, S, exec, ~/.config/hypr/scripts/screenshot.sh edit

# Quick screenshot (clipboard only)
bind = SUPER SHIFT, P, exec, ~/.config/hypr/scripts/screenshot-menu.sh

# CLIPBOARD HISTORY MANAGEMENT
bind = SUPER, V, exec, cliphist list | rofi -dmenu -p "Clipboard" -theme ~/.config/rofi/themes/hacker-green.rasi | cliphist decode | wl-copy
bind = SUPER SHIFT, V, exec, cliphist wipe && notify-send "Clipboard" "History cleared"
bind = SUPER CTRL, C, exec, wl-copy --clear
bind = SUPER ALT, V, exec, cliphist list | rofi -dmenu -p "Delete Entry" -theme ~/.config/rofi/themes/hacker-green.rasi | cliphist delete



# Live wallpaper: restore last waypaper selection on login (waypaper is the OSS app)
# Disabled — using blank black background instead of an animated wallpaper.
# exec-once = waypaper --restore
