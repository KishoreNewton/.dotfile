# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hypr.land/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf

# Export Wayland env to systemd/dbus and bring up the portal stack (fixes screen sharing)
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=Hyprland HYPRLAND_INSTANCE_SIGNATURE XDG_SESSION_TYPE && systemctl --user start hyprland-session.target

# Autostart waybar
exec-once = waybar
# Clipboard history daemons now run as systemd user services
# (cliphist-text.service / cliphist-image.service) so they auto-restart if
# their Wayland connection drops. exec-once starts them once with no restart,
# which silently killed clipboard history when the connection died.
#   systemctl --user status cliphist-text cliphist-image


################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
# Layout (logical coords after scaling):
#   DP-1 (middle, 4K UW) : 2560x1440 @ scale 1.6 -> logical 1600x900 at  0,0      (X: 0    -> 1600)
#   DP-2 (left,   4K)    : 3840x2160 @ scale 2.0 -> logical 1920x1080 at -1920,0  (X: -1920 -> 0)
#   HDMI-A-1 (right, rotated 90 CCW): 1920x1080 -> logical 1080x1920 at 1600,0    (X: 1600 -> 2680)
#   HDMI-A-2 (laptop/aux): 1360x768 placed ABOVE DP-2, with right edge aligned to DP-1's left edge (X=0)
#                          so cursor can travel up from DP-1/DP-2 without crossing a gap.
monitor=DP-1,2560x1440@59.95,0x0,1.6
monitor=DP-2,3840x2160@29.98,-1920x0,2.0
monitor=HDMI-A-1,1920x1080,1600x0,1,transform,1
monitor=HDMI-A-2,1360x768,-1360x-768,1

workspace=1,monitor:DP-2
workspace=2,monitor:DP-1
workspace=3,monitor:HDMI-A-1
workspace=4,monitor:HDMI-A-2


###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = terminator
$fileManager = nemo
$menu = wofi --show drun


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox

exec-once = swaync
exec-once = hyprctl setcursor Bibata-Modern-Ice 24


#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,Bibata-Modern-Ice

# NVIDIA: use software cursors to fix jittery hardware cursor
cursor {
    no_hardware_cursors = false
}

# NVIDIA primary, Intel iGPU secondary
# by-path IDs are stable across reboots; /dev/dri/cardN numbering is not
env = WLR_DRM_DEVICES,/dev/dri/by-path/pci-0000:01:00.0-card:/dev/dri/by-path/pci-0000:00:02.0-card

# NVIDIA GPU acceleration
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = LIBVA_DRIVER_NAME,nvidia
env = NVD_BACKEND,direct
env = __GL_GSYNC_ALLOWED,1
env = __GL_VRR_ALLOWED,1

# Direct scanout — bypass compositor for fullscreen apps (less latency)
render:direct_scanout = true


# Scale XWayland apps to match the focused monitor
# Uses highest scale (2.0) so apps are sharp on all monitors
# Hyprland auto-downscales on lower-scale monitors
env = GDK_SCALE,2
env = QT_AUTO_SCREEN_SCALE_FACTOR,1

xwayland {
    force_zero_scaling = true
}


###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

