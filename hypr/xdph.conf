# xdg-desktop-portal-hyprland config
# Fixes screen sharing on this multi-monitor setup (rotated HDMI-A-1 broke the picker,
# causing "selection -1" / NotAllowedError in all browsers).
screencopy {
    # Remember the chosen source and reuse it via a restore token, so the
    # share-picker is skipped on repeat shares (avoids the rotated-monitor click bug).
    allow_token_by_default = true

    max_fps = 60
}
